# The AOSP IMS backport (aosp-ims/), built from source on a clean machine:
# the APKs, the three flashable zips and their end-to-end installer tests,
# and the repacked LineageOS 22.2 ROM with its checks.
#
# Publishing is explicit: a push that changes aosp-ims/RELEASE (or a manual
# run with "publish" ticked) publishes a green build as a GitHub
# prerelease under the tag RELEASE names, unless that release exists
# already. Every other run is a build check. RELEASE holds four lines: the
# tag, the package version, the ROM's version suffix, the release title.
# Every input is pinned in aosp-ims/upstream.lock.
name: aosp-ims

on:
  push:
    paths:
      - 'aosp-ims/**'
      - '!aosp-ims/**/*.md'
      - 'ims-service/assets/**'
      - 'scripts/**'
      - 'permissions/**'
      - 'apn/**'
      - 'upstream/aosp-ims/**'
      - 'META-INF/**'
      - '.github/workflows/aosp-ims.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release named in aosp-ims/RELEASE if it does not exist yet
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aosp-ims-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Release metadata
        id: meta
        env:
          BEFORE: ${{ github.event.before }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          publish=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            publish=${PUBLISH_INPUT:-false}
          elif [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then
            publish=true   # the first push of a branch
          elif git fetch -q --depth=1 origin "$BEFORE" \
              && ! git diff --quiet "$BEFORE" HEAD -- aosp-ims/RELEASE; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish: $publish"
          for i in 1 2 3 4; do
            v=$(sed -n "${i}p" aosp-ims/RELEASE)
            [ -n "$v" ] || { echo "aosp-ims/RELEASE line $i is empty"; exit 1; }
          done
          {
            echo "tag=$(sed -n 1p aosp-ims/RELEASE)"
            echo "version=$(sed -n 2p aosp-ims/RELEASE)"
            echo "romtag=$(sed -n 3p aosp-ims/RELEASE)"
            echo "title=$(sed -n 4p aosp-ims/RELEASE)"
          } >> "$GITHUB_OUTPUT"

      - name: Disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
              /usr/local/share/boost /usr/local/lib/node_modules
          W=$HOME/aosp-work
          if [ -d /mnt ] && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -gt 30 ]; then
            W=/mnt/aosp-work
          fi
          sudo mkdir -p "$W" && sudo chown "$USER" "$W"
          echo "WORK=$W" >> "$GITHUB_ENV"
          df -h / /mnt || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q brotli e2fsprogs ninja-build mksh busybox-static toybox zip unzip

      - name: Android SDK and NDK
        run: |
          SM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "ndk;$(. aosp-ims/upstream.lock && echo "$NDK_VERSION")" \
              "build-tools;36.1.0" "platforms;android-35" >/dev/null
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/build-tools"

      - name: Build (sources, Java, native, APKs, zips)
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version }}
        run: aosp-ims/tools/build-all.sh

      - name: The kit's build files under Android 15's Soong
        run: aosp-ims/tests/check-soong.sh --verify-stubs

      - name: AOSP 17's CarrierConfig changes, regenerated from the pinned sources
        run: aosp-ims/tools/regen-aosp-carrierconfig.sh --check

      - name: Carrier config matches the gate and the device patch
        run: |
          python3 aosp-ims/tests/check-carrier-config.py \
              ims-service/assets/carrier-id-map.json ims-service/assets/carrier-plmn-map.json \
              aosp-ims/zip/java/com/android/imsstack/joan/CarrierImsGate.java \
              "$WORK/aosp15/telephonyprovider/assets/latest_carrier_id/carrier_list.textpb" \
              --base aosp-ims/carrier/aosp17-carrierconfig-ims.xml \
              --imported aosp-ims/carrier/lineage-pixel-ims.xml --fill aosp-ims/carrier/lg-ims.xml \
              --patch upstream/aosp-ims/device/0001-joan-common-Add-the-AOSP-IMS-stack.patch

      - name: IMS APNs added to LineageOS's own list
        run: |
          . aosp-ims/upstream.lock
          git init -q "$RUNNER_TEMP/vendor-apn"
          git -C "$RUNNER_TEMP/vendor-apn" fetch -q --depth 1 "$LINEAGE_APN_URL" "$LINEAGE_APN_COMMIT"
          git -C "$RUNNER_TEMP/vendor-apn" checkout -q FETCH_HEAD
          python3 aosp-ims/tests/check-apns.py aosp-ims/carrier/lineage-pixel-apns.xml \
              "$RUNNER_TEMP/vendor-apn"

      - name: Installer end-to-end tests
        run: |
          sudo env "PATH=$PATH" aosp-ims/tests/run-e2e-install.sh | tee "$RUNNER_TEMP/e2e.log"
          grep -q 'all passed' "$RUNNER_TEMP/e2e.log"

      - name: Repack the LineageOS ROM
        env:
          ROM_TAG: ${{ steps.meta.outputs.romtag }}
        run: |
          sudo env "PATH=$PATH" "WORK=$WORK" "ROM_TAG=$ROM_TAG" aosp-ims/tools/repack-rom.sh
          sudo chown -R "$USER" "$WORK/out"
          TMPDIR=$WORK aosp-ims/tests/check-rom.sh "$WORK"/out/rom/*.zip "$WORK/out/apk"

      - name: Checksums
        run: |
          cd "$WORK/out"
          cp "$GITHUB_WORKSPACE/aosp-ims/zip/grant-permissions.sh" .
          sha256sum zip/*.zip rom/*.zip grant-permissions.sh | sed 's#  [a-z]*/#  #' | tee SHA256SUMS

      - name: Publish the prerelease named in aosp-ims/RELEASE
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; this run was a build check."
            exit 0
          fi
          cd "$WORK/out"
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "$TITLE" \
              --notes-file "$GITHUB_WORKSPACE/aosp-ims/RELEASE-NOTES.md" \
              rom/*.zip zip/*.zip grant-permissions.sh SHA256SUMS
