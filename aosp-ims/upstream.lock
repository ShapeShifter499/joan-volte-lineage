# Pinned inputs of the AOSP IMS backport. Sourced by tools/*.sh.

# AOSP 17 IMS stack: sources, patched by patches/<project>/*.patch.
IMSSTACK_URL=https://android.googlesource.com/platform/packages/modules/ImsStack
IMSSTACK_REF=android-17.0.0_r1
IMSSTACK_COMMIT=1e3981c23117d75d5ad304b32bb030327ad33eaa
IMSMEDIA_URL=https://android.googlesource.com/platform/packages/modules/ImsMedia
IMSMEDIA_REF=android-17.0.0_r1
IMSMEDIA_COMMIT=0101cb4caf48dbcc3b8fbc6ab3e41137b90b8e67
# VoWiFi: the ePDG tunnel (IWLAN) and the LTE/Wi-Fi transport choice (QNS).
IWLAN_URL=https://android.googlesource.com/platform/packages/services/Iwlan
IWLAN_REF=android-17.0.0_r1
IWLAN_COMMIT=ddf0eb7f277ea6a5a62c63678d17218714f38071
QNS_URL=https://android.googlesource.com/platform/packages/services/QualifiedNetworksService
QNS_REF=android-17.0.0_r1
QNS_COMMIT=f1500926b882a189c7c5772368835d5de700b34f
# Libraries QNS and IWLAN link statically (sparse checkouts at the same tag).
LIBS_REF=android-17.0.0_r1

# Where carrier/lineage-pixel-ims.xml comes from (tools/import-carrier-settings.py):
# the Pixel CarrierSettings LineageOS ships for Pixels, converted with its own
# carriersettings-extractor. Only needed to regenerate that file.
CARRIERSETTINGS_URL=https://github.com/TheMuppets/proprietary_vendor_google_husky
CARRIERSETTINGS_REF=lineage-24.0
CARRIERSETTINGS_COMMIT=7085ddc01630fdfed802c5900db1b1b6a42cd90c
CARRIERSETTINGS_PATH=proprietary/product/etc/CarrierSettings
LINEAGE_SCRIPTS_URL=https://github.com/LineageOS/scripts
LINEAGE_SCRIPTS_COMMIT=e81615b64084478eae6af876908e77371bd08660
# carrier/lineage-pixel-apns.xml is the converter's APN list from the same
# inputs (tools/import-carrier-apns.py). tests/check-apns.py checks the
# APNs tools/make-apns.py adds against LineageOS's own list at this commit.
LINEAGE_APN_URL=https://github.com/LineageOS/android_vendor_apn
LINEAGE_APN_COMMIT=6e73ba90cc9438d1aefb4c323289b281b006a59a

# carrier/aosp17-carrierconfig-ims.xml is the IMS part of what AOSP 17's
# CarrierConfig assets changed since Android 15
# (tools/import-aosp-carrierconfig.py, from tools/regen-aosp-carrierconfig.sh,
# which CI runs to check the file is current): both asset sets, both
# carrier id lists, and Android 15's CarrierConfigManager for defaults.
AOSP_CARRIERCONFIG_URL=https://android.googlesource.com/platform/packages/apps/CarrierConfig
AOSP_CARRIERCONFIG_A15_COMMIT=e800ce78fcbd63511853022c105ab3fc557b8756
AOSP_CARRIERCONFIG_A17_COMMIT=c9f82c3de8293731d4230758dc258916c12335a6
AOSP_TELEPHONYPROVIDER_URL=https://android.googlesource.com/platform/packages/providers/TelephonyProvider
AOSP_TELEPHONYPROVIDER_A15_COMMIT=4b3aa80a7ee5858981c17065e197119aebecadd8
AOSP_TELEPHONYPROVIDER_A17_COMMIT=013b803626164c026025897b7dec45521c2cccab
AOSP_FRAMEWORKS_BASE_URL=https://android.googlesource.com/platform/frameworks/base
AOSP_FRAMEWORKS_BASE_A15_COMMIT=396d32905ded85c082232bc510b525c9e372e585

# Android 15 QPR2, what LineageOS 22.2 is built on (BP1A.250505.005):
# platform headers come from this branch, libc++ headers from the clang
# release Soong used for it (build/soong cc/config/global.go).
PLATFORM_BRANCH=android15-qpr2-release
CLANG_VERSION=clang-r536225

# The ROM the result must run on: its framework is the Java classpath and
# its /system/lib64 libraries are what the native code links against.
LINEAGE_OTA_URL=https://mirrorbits.lineageos.org/full/joan/20260920/lineage-22.2-20260920-nightly-joan-signed.zip
LINEAGE_OTA_SHA256=f8ef5e51da8cc88fd863bcdb82bb91f9f4c4adb8626b5d8a5dee29593e01b3a6

NDK_VERSION=29.0.14206865
DEX2JAR_VERSION=2.4.38
ASM_VERSION=9.10.1
AUTOVALUE_VERSION=1.11.0
